include:
  - path:
      - compose-common.yaml
      - compose-file-storage-${ORO_FILE_STORAGE_SERVICE:-mongo}.yaml
      # Data of the services in memory (ORO_SERVICES_TMPFS=tmpfs), otherwise compose-no.yaml
      - compose-${ORO_SERVICES_TMPFS:-no}${ORO_SERVICES_TMPFS:+-file-storage-${ORO_FILE_STORAGE_SERVICE:-mongo}}.yaml
      - compose-${ORO_SEARCH_SERVICE:-es}.yaml
      - compose-${ORO_MQ_SERVICE:-rmq}.yaml
      - compose-${ORO_PDF_CONVERSION_SERVICE:-gotenberg}.yaml
      - compose-proxy-${ORO_APP_PROTOCOL}.yaml
      - compose-${ORO_DOCKER_FOLDER_MODE:-prod}.yaml
      - compose${ORO_DEBUGGER}.yaml
      # TLS for Redis, RabbitMQ, Elasticsearch, PostgreSQL, SMTP and Gotenberg: ORO_SERVICES_TLS=tls, otherwise compose-no.yaml
      - compose-${ORO_SERVICES_TLS:-no}.yaml
      # The cache in memory (ORO_SERVICES_TMPFS=tmpfs), otherwise compose-no.yaml. Must stay the last include
      - compose-${ORO_SERVICES_TMPFS:-no}${ORO_SERVICES_TMPFS:+-cache}.yaml
    env_file:
      - .env
      - .env-ce-${ORO_CE:-no}
      - .env-ce-${ORO_CE:-no}${ORO_SERVICES_TLS:+-tls}
