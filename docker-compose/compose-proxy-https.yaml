services:
  # The CA and its trust for https, the certificate of the services for ORO_SERVICES_TLS=tls: see compose-pki-init.yaml
  pki-init:
    extends:
      file: compose-pki-init.yaml
      service: pki-init

  waf:
    ports:
      - published: 80
        target: $ORO_NGINX_HTTP_PORT
      - published: 443
        target: $ORO_NGINX_HTTPS_PORT

  waf-behat:
    cap_add:
      - NET_BIND_SERVICE
    expose:
      - $ORO_NGINX_HTTP_PORT
      - $ORO_NGINX_HTTPS_PORT
    healthcheck:
      test: "curl -ILf ${ORO_APP_PROTOCOL}://${ORO_APP_DOMAIN}:${ORO_NGINX_HTTPS_PORT}/"
      interval: 15s
      timeout: 30s
      start_period: 15s
    volumes:
      - etc-pki:/etc/pki

  waf-init:
    command:
      - -c
      - |
        sed -i 's/1024/0/g' /variables.schema.json
        export ORO_GLOBAL_ROOT_CA_CERT=$(cat $$CAROOT/rootCA.pem)
        export ORO_GLOBAL_ROOT_CA_KEY=$(cat $$CAROOT/rootCA-key.pem)
        /docker-entrypoint.sh -m init
    environment:
      CAROOT: $ORO_CAROOT
    depends_on:
      "pki-init":
        condition: service_completed_successfully
    volumes:
      - etc-pki:/etc/pki

  php-fpm-app:
    volumes:
      - etc-pki:/etc/pki

  consumer:
    volumes:
      - etc-pki:/etc/pki

  behat:
    environment:
      CAROOT: $ORO_CAROOT
    depends_on:
      "pki-init":
        condition: service_completed_successfully
    volumes:
      - etc-pki:/etc/pki

  restore:
    depends_on:
      "pki-init":
        condition: service_completed_successfully
    volumes:
      - cache:/var/www/oro/var/cache
      - etc-pki:/etc/pki
      - ./../docker/docker-entrypoint-init.sh:/usr/local/bin/docker-entrypoint.sh

  chrome:
    environment:
      CAROOT: $ORO_CAROOT
    depends_on:
      "pki-init":
        condition: service_completed_successfully
    volumes:
      - etc-pki:/etc/pki

volumes:
  etc-pki: {}
  services-tls: {}
